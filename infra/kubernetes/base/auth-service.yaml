apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: secureflow
spec:
  replicas: 1
  selector:
    matchLabels:
      svc: auth-service
  template:
    metadata:
      labels:
        svc: auth-service
        env: dev              # Resolved: require-labels
        owner: devsecops      # Resolved: require-labels
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "auth-service"
        vault.hashicorp.com/agent-inject-secret-config: "secureflow/data/auth-service"
        # New additions: Satisfy Gatekeeper's resource limits for the injected sidecar
        vault.hashicorp.com/agent-limits-cpu: "250m"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/agent-requests-cpu: "128m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        
    spec:
      serviceAccountName: auth-service
      containers:
        - name: auth-service
          image: secureflow/auth-service:v1.0.0   # Resolved: no-latest-tag
          ports:
            - containerPort: 5001
          env:
            - name: DB_HOST
              value: auth-db
            - name: DB_NAME
              value: authdb
            - name: DB_USER
              value: authuser
          securityContext:                        # Resolved: no-privileged-containers
            allowPrivilegeEscalation: false
            runAsUser: 1000
          resources:                              # Resolved: require-resource-limits
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: secureflow
spec:
  selector:
    svc: auth-service
  ports:
    - port: 5001
      targetPort: 5001