apiVersion: v1
kind: ServiceAccount
metadata:
  name: transaction-service
  namespace: secureflow
  labels:
    app: transaction-service
    team: devsecops
    env: dev
    owner: devsecops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: secureflow
  labels:
    svc: transaction-service
    app: transaction-service
    team: devsecops
    env: dev
    owner: devsecops
spec:
  replicas: 1
  selector:
    matchLabels:
      svc: transaction-service
  template:
    metadata:
      labels:
        svc: transaction-service
        app: transaction-service
        team: devsecops
        env: dev
        owner: devsecops
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "transaction-service"
        vault.hashicorp.com/agent-inject-secret-config: "secureflow/data/transaction-service"
        vault.hashicorp.com/agent-limits-cpu: "250m"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/agent-requests-cpu: "128m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
    spec:
      serviceAccountName: transaction-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transaction-service
          image: secureflow/transaction-service:v1.0.0
          ports:
            - containerPort: 5002
          env:
            - name: DB_HOST
              value: transaction-db
            - name: DB_NAME
              value: transactiondb
            - name: DB_USER
              value: txuser
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: secureflow-config
                  key: AUTH_SERVICE_URL
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: secureflow
  labels:
    app: transaction-service
    team: devsecops
    env: dev
    owner: devsecops
spec:
  selector:
    svc: transaction-service
  ports:
    - port: 5002
      targetPort: 5002