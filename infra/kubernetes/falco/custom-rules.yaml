# Falco Helm Values & 4 Custom Runtime Rules for SecureFlow (Step 16 / Day 8)
driver:
  kind: modern_ebpf

collectors:
  kubernetes:
    enabled: true

falco:
  json_output: true
  json_include_output_property: true
  log_stderr: true
  log_syslog: false
  priority: warning

customRules:
  secureflow_rules.yaml: |-
    - macro: secureflow_namespace
      condition: (k8s.ns.name = "secureflow")

    - list: shell_binaries
      items: [sh, bash, zsh, dash, ash, ksh, csh, tcsh]

    - list: package_mgmt_binaries
      items: [apt, apt-get, dpkg, pip, pip3, apk, yum, rpm, dnf]

    # Rule 1: Shell spawn or interactive command execution in a SecureFlow container
    - rule: SecureFlow Shell Spawn in Container
      desc: Detect a shell or post-exploitation identity command spawned inside a SecureFlow container
      condition: >
        spawned_process and
        container and
        secureflow_namespace and
        (proc.name in (shell_binaries) or proc.name in (id, whoami))
      output: >
        [SECUREFLOW-RUNTIME-01] Shell or recon command spawned in SecureFlow container
        (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name container=%container.name
        proc=%proc.name cmdline=%proc.cmdline parent=%proc.pname)
      priority: WARNING
      tags: [secureflow, runtime, shell, mitre_execution]

    # Rule 2: Sensitive file read (/etc/shadow, /etc/passwd, /etc/sudoers)
    - rule: SecureFlow Sensitive File Read
      desc: Detect any attempt to read sensitive system credential files inside a SecureFlow container
      condition: >
        open_read and
        container and
        secureflow_namespace and
        fd.name in (/etc/shadow, /etc/sudoers, /etc/pam.conf)
      output: >
        [SECUREFLOW-RUNTIME-02] Sensitive file read detected in SecureFlow container
        (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name container=%container.name
        file=%fd.name cmdline=%proc.cmdline)
      priority: CRITICAL
      tags: [secureflow, runtime, credential_access, mitre_credential_access]

    # Rule 3: Unexpected outbound network connection
    - rule: SecureFlow Unexpected Outbound Connection
      desc: Detect unexpected outbound TCP/UDP connections from SecureFlow containers outside allowed internal ports (5000, 5001, 5002, 5432, 8200, 53)
      condition: >
        outbound and
        container and
        secureflow_namespace and
        not (fd.sport in (53, 5000, 5001, 5002, 5432, 8200))
      output: >
        [SECUREFLOW-RUNTIME-03] Unexpected outbound connection from SecureFlow container
        (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name container=%container.name
        dest_ip=%fd.rip dest_port=%fd.rport proto=%fd.l4proto cmdline=%proc.cmdline)
      priority: CRITICAL
      tags: [secureflow, runtime, network, exfiltration, mitre_command_and_control]

    # Rule 4: Package manager execution at runtime
    - rule: SecureFlow Package Manager Execution at Runtime
      desc: Detect package manager invocation (apt, apt-get, dpkg, pip) inside a running SecureFlow container
      condition: >
        spawned_process and
        container and
        secureflow_namespace and
        proc.name in (package_mgmt_binaries)
      output: >
        [SECUREFLOW-RUNTIME-04] Package manager executed at runtime in SecureFlow container
        (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name container=%container.name
        proc=%proc.name cmdline=%proc.cmdline)
      priority: ERROR
      tags: [secureflow, runtime, persistence, mitre_persistence]