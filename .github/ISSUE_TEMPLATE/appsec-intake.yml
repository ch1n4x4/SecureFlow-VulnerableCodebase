name: AppSec Intake
description: Handoff for AppSec-owned security findings from the security gate
title: "[AppSec] "
labels:
  - appsec
body:
  - type: markdown
    attributes:
      value: |
        ## AppSec Security Finding Handoff

        This issue was created from the repository security gate for an
        AppSec-owned finding. SonarQube and ZAP findings are non-blocking
        in the security gate.

  - type: input
    id: repository
    attributes:
      label: Repository
      description: Repository containing the finding
      placeholder: organization/repository
    validations:
      required: true

  - type: input
    id: pull_request
    attributes:
      label: Pull Request
      description: PR where the finding was detected
      placeholder: "#123"
    validations:
      required: true

  - type: dropdown
    id: scanner
    attributes:
      label: Scanner
      options:
        - SonarQube
        - ZAP
    validations:
      required: true

  - type: input
    id: finding_id
    attributes:
      label: Finding ID
      description: Scanner finding identifier
    validations:
      required: true

  - type: input
    id: severity
    attributes:
      label: Severity
      description: Normalized severity reported by the security gate
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Finding Title
    validations:
      required: true

  - type: textarea
    id: finding_details
    attributes:
      label: Finding Details
      description: Explain what was detected and where.
    validations:
      required: true

  - type: textarea
    id: affected_path
    attributes:
      label: Affected Path or Endpoint
      description: File, resource, URL, or endpoint affected.

  - type: input
    id: finding_url
    attributes:
      label: Finding URL
      description: Link to the scanner finding, when available.

  - type: textarea
    id: remediation
    attributes:
      label: Suggested Remediation
      description: Recommended remediation or investigation notes.

  - type: textarea
    id: notes
    attributes:
      label: Additional Context