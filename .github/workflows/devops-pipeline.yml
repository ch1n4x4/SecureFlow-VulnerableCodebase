name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          brew install gitleaks

      - name: Verify Gitleaks
        run: |
          gitleaks version

      - name: Run Gitleaks (full history scan)
        run: |
          gitleaks detect \
            --source . \
            --log-opts='--all' \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set Sonar project key
        run: echo "SONAR_PROJECT_KEY=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Export findings and check severity
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
        run: |
          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            -o sonar-findings.json

          if jq -e '.issues[] | select(.severity == "CRITICAL" or .severity == "BLOCKER")' sonar-findings.json > /dev/null; then
            echo "::error::CRITICAL or BLOCKER findings detected."
            exit 1
          fi

          echo "No CRITICAL or BLOCKER findings."

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json
          if-no-files-found: warn