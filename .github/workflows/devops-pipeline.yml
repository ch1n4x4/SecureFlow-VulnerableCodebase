name: Gitleaks

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run Gitleaks
        run: |
          gitleaks git \
            --redact \
            --log-opts="--all" \
            .