name: DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: brew install gitleaks

      - name: Verify Gitleaks
        run: gitleaks version

      - name: Run Gitleaks (full history scan)
        run: |
          set +e
          gitleaks detect \
            --source . \
            --log-opts='--all' \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 1
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::error::Gitleaks execution failed with exit code $status."
            exit "$status"
          fi
          echo "Gitleaks findings are collected by the security gate."

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Sonar project key
        run: echo "SONAR_PROJECT_KEY=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Export findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
        run: |
          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            -o sonar-findings.json
          jq empty sonar-findings.json

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json
          if-no-files-found: warn

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build auth-service
        run: docker build -t auth-service:${{ github.sha }} ./services/auth-service

      - name: Build frontend
        run: docker build -t frontend:${{ github.sha }} ./services/frontend

      - name: Build transaction-service
        run: docker build -t transaction-service:${{ github.sha }} ./services/transaction-service

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan auth-service
        run: trivy image --severity HIGH,CRITICAL --format json --output auth-service.json auth-service:${{ github.sha }}

      - name: Scan frontend
        run: trivy image --severity HIGH,CRITICAL --format json --output frontend.json frontend:${{ github.sha }}

      - name: Scan transaction-service
        run: trivy image --severity HIGH,CRITICAL --format json --output transaction-service.json transaction-service:${{ github.sha }}

      - name: Combine Trivy reports
        run: |
          jq -s '{SchemaVersion: 2, Reports: .}' \
            auth-service.json \
            frontend.json \
            transaction-service.json \
            > trivy-report.json
          jq empty trivy-report.json

      - name: Upload combined Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

  trivy-kubernetes:
    name: Trivy Kubernetes Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/kubernetes/
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: json
          output: trivy-kubernetes-report.json

      - name: Upload Trivy Kubernetes report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-kubernetes-report
          path: trivy-kubernetes-report.json
          if-no-files-found: warn

  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: true

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-report.json
          if-no-files-found: warn

  zap:
    name: ZAP (non-blocking AppSec)
    runs-on: ubuntu-latest
    if: ${{ vars.ZAP_BASE_URL != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true
        with:
          target: ${{ vars.ZAP_BASE_URL }}
          cmd_options: "-J zap-report.json"

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-findings
          path: zap-report.json
          if-no-files-found: warn

  security-gate:
    name: security-gate
    needs:
      - gitleaks
      - sonarqube
      - trivy-scan
      - trivy-kubernetes
      - checkov-terraform
      - zap
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download scanner reports
        uses: actions/download-artifact@v4
        with:
          path: security-results
          pattern: "*-report"
          merge-multiple: true

      - name: Download scanner findings
        uses: actions/download-artifact@v4
        with:
          path: security-results
          pattern: "*-findings"
          merge-multiple: true
        continue-on-error: true

      - name: List downloaded reports
        run: find security-results -type f -maxdepth 3 -print | sort

      - name: Run security gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APPSEC_INTAKE_URL: ${{ vars.APPSEC_INTAKE_URL }}
          POLICY_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          chmod +x pipeline/scripts/security-gate.sh
          pipeline/scripts/security-gate.sh

  image-sign:
    name: Build, Sign, and Attest Images
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push images and signatures to GHCR
    
    env:
      REGISTRY: ghcr.io
      # Example for the auth-service. Repeat build/push/sign steps for frontend and transaction-service.
      IMAGE_NAME: ghcr.io/${{ github.repository }}/auth-service
      TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push final image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.TAG }} ./services/auth-service
          docker push ${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Sign the published image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          # The -y flag automatically accepts the registry prompt
          cosign sign --key env://COSIGN_PRIVATE_KEY -y ${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Generate SPDX SBOM with Trivy
        run: |
          trivy image --format spdx-json --output sbom.spdx.json ${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Attest the SBOM to the image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign attest --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate sbom.spdx.json -y ${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Verify the signature
        run: |
          # Verifies against the public key you committed to the repository root
          cosign verify --key cosign.pub ${{ env.IMAGE_NAME }}:${{ env.TAG }}