name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          brew install gitleaks

      - name: Verify Gitleaks
        run: |
          gitleaks version

      - name: Run Gitleaks (full history scan)
        run: |
          gitleaks detect \
            --source . \
            --log-opts='--all' \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set Sonar project key
        run: echo "SONAR_PROJECT_KEY=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Export findings and check severity
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
        run: |
          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            -o sonar-findings.json

          if jq -e '.issues[] | select(.severity == "CRITICAL" or .severity == "BLOCKER")' sonar-findings.json > /dev/null; then
            echo "::error::CRITICAL or BLOCKER findings detected."
            exit 1
          fi

          echo "No CRITICAL or BLOCKER findings."

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json
          if-no-files-found: warn

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build auth-service
        run: |
          docker build \
            -t auth-service:${{ github.sha }} \
            ./services/auth-service

      - name: Build frontend
        run: |
          docker build \
            -t frontend:${{ github.sha }} \
            ./services/frontend

      - name: Build transaction-service
        run: |
          docker build \
            -t transaction-service:${{ github.sha }} \
            ./services/transaction-service

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan auth-service
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format json \
            --output auth-service.json \
            auth-service:${{ github.sha }}

      - name: Scan frontend
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format json \
            --output frontend.json \
            frontend:${{ github.sha }}

      - name: Scan transaction-service
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format json \
            --output transaction-service.json \
            transaction-service:${{ github.sha }}

      - name: Combine Trivy reports
        run: |
          jq -s '{
            SchemaVersion: 2,
            Reports: .
          }' \
          auth-service.json \
          frontend.json \
          transaction-service.json \
          > trivy-report.json

      - name: Check for HIGH or CRITICAL vulnerabilities
        run: |
          if jq -e '
            [.Reports[].Results[]?.Vulnerabilities[]? |
              select(.Severity == "HIGH" or .Severity == "CRITICAL")
            ] | length > 0
          ' trivy-report.json > /dev/null; then
            echo "HIGH or CRITICAL vulnerabilities found"
            exit 1
          else
            echo "No HIGH or CRITICAL vulnerabilities found"
          fi

      - name: Upload combined Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  trivy-kubernetes:
    name: Trivy Kubernetes Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infra/kubernetes/'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'json'
          output: 'trivy-kubernetes-report.json'

      - name: Upload Trivy Kubernetes report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-kubernetes-report
          path: trivy-kubernetes-report.json     
          
  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: false

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-report.json