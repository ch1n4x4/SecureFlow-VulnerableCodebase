name: DevSecOps Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: brew install gitleaks

      - name: Verify Gitleaks
        run: gitleaks version

      - name: Run Gitleaks (full history scan)
        run: |
          # Gitleaks native --exit-code 1 will hard-fail the step if a secret is found.
          gitleaks detect \
            --source . \
            --log-opts='--all' \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Sonar project key
        run: echo "SONAR_PROJECT_KEY=$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2-)" >> "$GITHUB_ENV"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Export findings and enforce Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
        run: |
          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            -o sonar-findings.json
          jq empty sonar-findings.json
          
          # Log warning but do not hard-fail on CRITICAL or BLOCKER
          ISSUES_COUNT=$(jq '[.issues[]? | select(.severity == "CRITICAL" or .severity == "BLOCKER")] | length' sonar-findings.json)
          if [ "$ISSUES_COUNT" -gt 0 ]; then
            echo "::warning::SonarQube found $ISSUES_COUNT CRITICAL/BLOCKER issues. Continuing without hard-failure."
          fi

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json
          if-no-files-found: warn

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build auth-service
        run: docker build -t auth-service:${{ github.sha }} ./services/auth-service

      - name: Build frontend
        run: docker build -t frontend:${{ github.sha }} ./services/frontend

      - name: Build transaction-service
        run: docker build -t transaction-service:${{ github.sha }} ./services/transaction-service

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan auth-service
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --format json --output auth-service.json auth-service:${{ github.sha }}

      - name: Scan frontend
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --format json --output frontend.json frontend:${{ github.sha }}

      - name: Scan transaction-service
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --format json --output transaction-service.json transaction-service:${{ github.sha }}

      - name: Combine Trivy reports and evaluate
        run: |
          jq -s '{SchemaVersion: 2, Reports: .}' \
            auth-service.json \
            frontend.json \
            transaction-service.json \
            > trivy-report.json
          jq empty trivy-report.json
          
          # Hard-fail on CRITICAL/HIGH (Since the scans only pulled these severities, any vulnerability present is a failure)
          VULN_COUNT=$(jq '[.Reports[]?.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "::error::Trivy Image Scan found $VULN_COUNT HIGH/CRITICAL vulnerabilities."
            exit 1
          fi

      - name: Upload combined Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

  trivy-kubernetes:
    name: Trivy Kubernetes Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/kubernetes/
          severity: HIGH,CRITICAL
          exit-code: "1" # Enforce hard-failure
          format: json
          output: trivy-kubernetes-report.json

      - name: Upload Trivy Kubernetes report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-kubernetes-report
          path: trivy-kubernetes-report.json
          if-no-files-found: warn

  checkov-terraform:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: false # Enforce hard-fail
         
      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-report.json
          if-no-files-found: warn

  security-gate:
    name: security-gate
    needs:
      - gitleaks
      - sonarqube
      - trivy-scan
      - trivy-kubernetes
      - checkov-terraform
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download scanner reports
        uses: actions/download-artifact@v4
        with:
          path: security-results
          pattern: "*-report"
          merge-multiple: true

      - name: Download scanner findings
        uses: actions/download-artifact@v4
        with:
          path: security-results
          pattern: "*-findings"
          merge-multiple: true
        continue-on-error: true

      - name: List downloaded reports
        run: find security-results -type f -maxdepth 3 -print | sort

      - name: Run security gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          APPSEC_INTAKE_URL: ${{ vars.APPSEC_INTAKE_URL }}
          POLICY_REF: ${{ github.base_ref || github.ref_name }}
          # Pass upstream DevSecOps job statuses into the shell script
          GITLEAKS_STATUS: ${{ needs.gitleaks.result }}
          TRIVY_SCAN_STATUS: ${{ needs.trivy-scan.result }}
          TRIVY_K8S_STATUS: ${{ needs.trivy-kubernetes.result }}
          CHECKOV_STATUS: ${{ needs.checkov-terraform.result }}
        run: |
          chmod +x pipeline/scripts/security-gate.sh
          pipeline/scripts/security-gate.sh
  image-sign:
    name: Build, Sign, and Attest Images
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push images to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        env:
          REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          docker build -t $REPO/auth-service:${{ github.sha }} ./services/auth-service
          docker push $REPO/auth-service:${{ github.sha }}
          
          docker build -t $REPO/frontend:${{ github.sha }} ./services/frontend
          docker push $REPO/frontend:${{ github.sha }}
          
          docker build -t $REPO/transaction-service:${{ github.sha }} ./services/transaction-service
          docker push $REPO/transaction-service:${{ github.sha }}

      - name: Sign Images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY $REPO/auth-service:${{ github.sha }}
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY $REPO/frontend:${{ github.sha }}
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY $REPO/transaction-service:${{ github.sha }}

      - name: Generate SPDX SBOMs with Trivy
        env:
          REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          trivy image --format spdx-json --output auth-sbom.spdx $REPO/auth-service:${{ github.sha }}
          trivy image --format spdx-json --output front-sbom.spdx $REPO/frontend:${{ github.sha }}
          trivy image --format spdx-json --output trans-sbom.spdx $REPO/transaction-service:${{ github.sha }}

      - name: Attest SBOMs
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          cosign attest --yes --predicate auth-sbom.spdx --type spdx --key env://COSIGN_PRIVATE_KEY $REPO/auth-service:${{ github.sha }}
          cosign attest --yes --predicate front-sbom.spdx --type spdx --key env://COSIGN_PRIVATE_KEY $REPO/frontend:${{ github.sha }}
          cosign attest --yes --predicate trans-sbom.spdx --type spdx --key env://COSIGN_PRIVATE_KEY $REPO/transaction-service:${{ github.sha }}

      - name: Verify Signatures
        env:
          REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          # Requires cosign.pub to be committed to the repository root
          cosign verify --key cosign.pub $REPO/auth-service:${{ github.sha }}
          cosign verify --key cosign.pub $REPO/frontend:${{ github.sha }}
          cosign verify --key cosign.pub $REPO/transaction-service:${{ github.sha }}    