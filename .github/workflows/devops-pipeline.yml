name: Gitleaks

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          brew install gitleaks

      - name: Verify Gitleaks
        run: |
          gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks git \
            --redact \
            --log-opts="--all" \
            .