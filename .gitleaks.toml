title = "SecureFlow Gitleaks Configuration"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# SecureFlow-specific secret rules
# ---------------------------------------------------------------------------

[[rules]]
id = "secureflow-aws-access-key-id"
description = "SecureFlow AWS access key ID"
regex = '''(?i)\bAWS_ACCESS_KEY_ID\s*[:=]\s*["']?([^\s"',]+)["']?'''
secretGroup = 1
keywords = ["AWS_ACCESS_KEY_ID"]
tags = ["secureflow", "aws", "credential"]


[[rules]]
id = "secureflow-aws-secret-access-key"
description = "SecureFlow AWS secret access key"
regex = '''(?i)\bAWS_SECRET_ACCESS_KEY\s*[:=]\s*["']?([^\s"',]+)["']?'''
secretGroup = 1
keywords = ["AWS_SECRET_ACCESS_KEY"]
tags = ["secureflow", "aws", "credential"]


[[rules]]
id = "secureflow-ath-db-password"
description = "SecuureFlow authentication database password"
regex = '''(?i)\bAUTH_DB_PASSWORD\s*[:=]\s*["']?([^\s"',]+)["']?'''
secretGroup = 1
keywords = ["AUTH_DB_PASSWORD"]
tags = ["secureflow", "database", "password"]


[[rules]]
id = "secureflow-transaction-db-password"
description = "SecureFlow transaction database password"
regex = '''(?i)\bTRANSACTION_DB_PASSWORD\s*[:=]\s*["']?([^\s"',]+)["']?'''
secretGroup = 1
keywords = ["TRANSACTION_DB_PASSWORD"]
tags = ["secureflow", "database", "password"]


[[rules]]
id = "secureflow-jwt-secret"
description = "SecureFlow JWT signing secret"
regex = '''(?i)\bJWT_SECRET\s*[:=]\s*["']?([^\s"',]+)["']?'''
secretGroup = 1
keywords = ["JWT_SECRET"]
tags = ["secureflow", "jwt", "secret"]